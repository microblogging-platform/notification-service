[project]
name = "notification-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Kyrylo Alieksieiev",email = "newkirilal@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "aio-pika (>=9.5.8,<10.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.6.1,<3.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "orjson (>=3.9.0)",
    "tenacity (>=8.2.0)",
    "motor (>=3.7.1,<4.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.2.0"
ruff = "^0.3.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true